services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U taskflow -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgres://taskflow:taskflow@db:5432/taskflow
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api/src:/app/api/src
      - ./api/test:/app/api/test
      - ./packages/shared/src:/app/packages/shared/src
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      API_URL: http://api:3000
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./web/src:/app/web/src
      - ./web/index.html:/app/web/index.html
      - ./packages/shared/src:/app/packages/shared/src

volumes:
  pgdata:
